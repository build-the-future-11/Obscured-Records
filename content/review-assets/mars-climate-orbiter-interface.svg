<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Mars Climate Orbiter: the unit mismatch</title><desc id="desc">The interface required Newton-seconds. Ground software supplied pound-force seconds, which navigation processing treated as Newton-seconds.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#833e35"/></marker></defs><rect width="1200" height="675" fill="#f5f0e5"/><text x="70" y="64" fill="#833e35" font-family="sans-serif" font-size="19" letter-spacing="3">OBSCURED RECORDS / EVIDENCE AND SYSTEMS</text><text x="70" y="114" fill="#24211f" font-family="sans-serif" font-size="34" font-weight="700">Mars Climate Orbiter: the unit mismatch</text><rect x="70" y="160" width="480" height="145" rx="7" fill="#fffcf5" stroke="#bdb3a4"/><text x="94" y="196" font-family="sans-serif" font-size="17" font-weight="700" fill="#833e35">INTERFACE REQUIREMENT</text><text x="94" y="239" font-family="sans-serif" font-size="22" fill="#24211f">Impulse values in N·s</text><text x="94" y="273" font-family="sans-serif" font-size="22" fill="#24211f">Meaning defined in the specification</text><rect x="650" y="160" width="480" height="145" rx="7" fill="#fffcf5" stroke="#bdb3a4"/><text x="674" y="196" font-family="sans-serif" font-size="17" font-weight="700" fill="#833e35">EXPECTED CONSUMER</text><text x="674" y="239" font-family="sans-serif" font-size="22" fill="#24211f">Navigation model</text><text x="674" y="273" font-family="sans-serif" font-size="22" fill="#24211f">Receives Newton-seconds</text><rect x="70" y="360" width="480" height="145" rx="7" fill="#fffcf5" stroke="#bdb3a4"/><text x="94" y="396" font-family="sans-serif" font-size="17" font-weight="700" fill="#833e35">ACTUAL DELIVERY</text><text x="94" y="439" font-family="sans-serif" font-size="22" fill="#24211f">Impulse values in lbf·s</text><text x="94" y="473" font-family="sans-serif" font-size="22" fill="#24211f">Produced by ground software</text><rect x="650" y="360" width="480" height="145" rx="7" fill="#fffcf5" stroke="#bdb3a4"/><text x="674" y="396" font-family="sans-serif" font-size="17" font-weight="700" fill="#833e35">ACTUAL INTERPRETATION</text><text x="674" y="439" font-family="sans-serif" font-size="22" fill="#24211f">Values read as N·s</text><text x="674" y="473" font-family="sans-serif" font-size="22" fill="#24211f">Effect underestimated ≈4.45×</text><path d="M550 230L645 230" stroke="#833e35" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M550 430L645 430" stroke="#833e35" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="70" y="565" font-family="sans-serif" font-size="21" fill="#24211f">The report traced the mismatch to ground software and documented contributing failures.</text><text x="70" y="613" font-family="sans-serif" font-size="17" fill="#605951">Schematic of selected findings. Source and full limitations accompany the article.</text></svg>
