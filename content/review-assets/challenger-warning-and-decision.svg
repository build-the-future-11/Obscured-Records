<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Challenger: concern and decision authority</title><desc id="desc">Engineering concerns informed an initial no-launch recommendation. Contractor management reversed that recommendation. The Rogers Commission found key information missing from final decision-makers.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#833e35"/></marker></defs><rect width="1200" height="675" fill="#f5f0e5"/><text x="70" y="64" fill="#833e35" font-family="sans-serif" font-size="19" letter-spacing="3">OBSCURED RECORDS / EVIDENCE AND SYSTEMS</text><text x="70" y="114" fill="#24211f" font-family="sans-serif" font-size="34" font-weight="700">Challenger: concern and decision authority</text><rect x="70" y="160" width="480" height="145" rx="7" fill="#fffcf5" stroke="#bdb3a4"/><text x="94" y="196" font-family="sans-serif" font-size="17" font-weight="700" fill="#833e35">ENGINEERING CONCERN</text><text x="94" y="239" font-family="sans-serif" font-size="22" fill="#24211f">O-ring behavior at low temperature</text><text x="94" y="273" font-family="sans-serif" font-size="22" fill="#24211f">Engineers continued to oppose launch</text><rect x="650" y="160" width="480" height="145" rx="7" fill="#fffcf5" stroke="#bdb3a4"/><text x="674" y="196" font-family="sans-serif" font-size="17" font-weight="700" fill="#833e35">INITIAL CONTRACTOR POSITION</text><text x="674" y="239" font-family="sans-serif" font-size="22" fill="#24211f">Recommend no launch</text><text x="674" y="273" font-family="sans-serif" font-size="22" fill="#24211f">Below prior temperature experience</text><rect x="650" y="360" width="480" height="145" rx="7" fill="#fffcf5" stroke="#bdb3a4"/><text x="674" y="396" font-family="sans-serif" font-size="17" font-weight="700" fill="#833e35">CONTRACTOR MANAGEMENT</text><text x="674" y="439" font-family="sans-serif" font-size="22" fill="#24211f">Reversed recommendation</text><text x="674" y="473" font-family="sans-serif" font-size="22" fill="#24211f">Recommended launch</text><rect x="70" y="360" width="480" height="145" rx="7" fill="#fffcf5" stroke="#bdb3a4"/><text x="94" y="396" font-family="sans-serif" font-size="17" font-weight="700" fill="#833e35">FINAL DECISION LEVEL</text><text x="94" y="439" font-family="sans-serif" font-size="22" fill="#24211f">Key concern history missing</text><text x="94" y="473" font-family="sans-serif" font-size="22" fill="#24211f">Commission: launch decision flawed</text><path d="M550 230L645 230" stroke="#833e35" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M890 305L890 355" stroke="#833e35" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M650 430L555 430" stroke="#833e35" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="70" y="565" font-family="sans-serif" font-size="21" fill="#24211f">Selected decision stages. The finding does not mean every manager lacked the warning.</text><text x="70" y="613" font-family="sans-serif" font-size="17" fill="#605951">Schematic of selected findings. Source and full limitations accompany the article.</text></svg>
