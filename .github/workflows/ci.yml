name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Test deployment routing
        run: node --test scripts/run-framework.test.mjs

      - name: Test signup and archive regressions
        run: node --experimental-strip-types --test scripts/newsletter.test.mjs scripts/search-query.test.mjs

      - name: Install locked dependencies
        run: npm run install:ci

      - name: Verify dependency inputs unchanged
        shell: bash
        run: git diff --exit-code -- package.json package-lock.json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Build for Vercel
        env:
          VERCEL: "1"
        run: npm run build

      - name: Verify Next.js server output
        shell: bash
        run: |
          set -euo pipefail
          test -s .next/BUILD_ID
          test -s .next/routes-manifest.json
          test -s .next/server/app-paths-manifest.json

      - name: Smoke test built Next.js application
        run: node scripts/next-runtime-smoke.mjs
