name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Official image supplies the matching browser engines and OS libraries.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble@sha256:35246d87a7c88ea9b771c65d33171b2611b02a8253b4b12ce6f94376c55f99f2
      options: --user 1001 --init --ipc=host
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Archive exact reviewed source
        run: git archive --format=tar.gz --output=site-source.tar.gz HEAD

      - name: Retain source reproduction archive
        uses: actions/upload-artifact@v4
        with:
          name: obscured-source-${{ env.SOURCE_SHA }}
          path: site-source.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary source archive
        run: rm -f site-source.tar.gz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Test deployment routing
        run: node --test scripts/run-framework.test.mjs

      - name: Install locked dependencies
        run: npm run install:ci

      - name: Test signup and archive regressions
        run: npm test

      - name: Verify dependency inputs unchanged
        shell: bash
        run: git diff --exit-code -- package.json package-lock.json

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Editorial content integrity
        run: node scripts/editorial-integrity.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify local Workers intake persistence
        run: node scripts/workers-intake-smoke.mjs

      - name: Build for Vercel
        env:
          VERCEL: "1"
        run: npm run build

      - name: Verify Next.js server output
        shell: bash
        run: |
          set -euo pipefail
          test -s .next/BUILD_ID
          test -s .next/routes-manifest.json
          test -s .next/server/app-paths-manifest.json

      - name: Smoke test built Next.js application
        run: node scripts/next-runtime-smoke.mjs

      - name: Install isolated tools and verify pinned Chromium
        env:
          BROWSER_TOOLS_DIR: ${{ runner.temp }}/obscured-browser
        run: |
          mkdir -p "$BROWSER_TOOLS_DIR"
          npm install --prefix "$BROWSER_TOOLS_DIR" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.0 axe-core@4.10.3
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import { resolve } from 'node:path';
          const requireTools = createRequire(resolve(process.env.BROWSER_TOOLS_DIR, 'package.json'));
          assert.equal(requireTools('playwright/package.json').version, '1.56.0',
            'Keep the Playwright package and container image versions identical.');
          const { chromium } = requireTools('playwright');
          const browser = await chromium.launch();
          console.log(`chromium ${browser.version()} at ${chromium.executablePath()}`);
          await browser.close();
          NODE

      - name: Browser interaction and responsive checks
        env:
          BROWSER_TOOLS_DIR: ${{ runner.temp }}/obscured-browser
        run: |
          node scripts/browser-smoke.mjs
          npm run smoke:browser:portal-retry

      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obscured-browser-${{ env.SOURCE_SHA }}
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7

