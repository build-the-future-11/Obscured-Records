<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Columbia: how an imagery request moved</title><desc id="desc">The debris assessment team sought on-orbit imagery. CAIB found the request used an engineering channel rather than the operational mission channel, diluting urgency. Uncertainty in the assessment was not fully conveyed upward.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#833e35"/></marker></defs><rect width="1200" height="675" fill="#f5f0e5"/><text x="70" y="64" fill="#833e35" font-family="sans-serif" font-size="19" letter-spacing="3">OBSCURED RECORDS / EVIDENCE AND SYSTEMS</text><text x="70" y="114" fill="#24211f" font-family="sans-serif" font-size="34" font-weight="700">Columbia: how an imagery request moved</text><rect x="70" y="160" width="480" height="145" rx="7" fill="#fffcf5" stroke="#bdb3a4"/><text x="94" y="196" font-family="sans-serif" font-size="17" font-weight="700" fill="#833e35">OBSERVATION AND ASSESSMENT</text><text x="94" y="239" font-family="sans-serif" font-size="22" fill="#24211f">Foam strike identified</text><text x="94" y="273" font-family="sans-serif" font-size="22" fill="#24211f">Team sought better imagery</text><rect x="650" y="160" width="480" height="145" rx="7" fill="#fffcf5" stroke="#bdb3a4"/><text x="674" y="196" font-family="sans-serif" font-size="17" font-weight="700" fill="#833e35">REQUEST ROUTE USED</text><text x="674" y="239" font-family="sans-serif" font-size="22" fill="#24211f">Engineering channel</text><text x="674" y="273" font-family="sans-serif" font-size="22" fill="#24211f">CAIB: urgency diluted</text><rect x="650" y="360" width="480" height="145" rx="7" fill="#fffcf5" stroke="#bdb3a4"/><text x="674" y="396" font-family="sans-serif" font-size="17" font-weight="700" fill="#833e35">MISSION OPERATIONAL CHANNEL</text><text x="674" y="439" font-family="sans-serif" font-size="22" fill="#24211f">Different route and authority</text><text x="674" y="473" font-family="sans-serif" font-size="22" fill="#24211f">Request did not use this route</text><rect x="70" y="360" width="480" height="145" rx="7" fill="#fffcf5" stroke="#bdb3a4"/><text x="94" y="396" font-family="sans-serif" font-size="17" font-weight="700" fill="#833e35">UNCERTAINTY IN THE RECORD</text><text x="94" y="439" font-family="sans-serif" font-size="22" fill="#24211f">Not fully conveyed upward</text><text x="94" y="473" font-family="sans-serif" font-size="22" fill="#24211f">Three imagery requests recorded</text><path d="M550 230L645 230" stroke="#833e35" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="70" y="565" font-family="sans-serif" font-size="21" fill="#24211f">Additional imagery does not establish that repair or rescue would have succeeded.</text><text x="70" y="613" font-family="sans-serif" font-size="17" fill="#605951">Schematic of selected findings. Source and full limitations accompany the article.</text></svg>
